<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Defense in depth: no script from anywhere but the bundle, no plugins, no
     frames, no forms. Images may come from the web and local files (mdv:). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' mdv: https: http: data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' mdv: https: http:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Preview</title>
<link rel="stylesheet" href="renderer.css">
</head>
<body class="mdv-empty">
<article id="content" class="markdown-body" dir="auto"></article>
<div class="mdv-placeholder">Nothing to preview</div>
<script src="renderer.js"></script>
</body>
</html>
